seeds:
- url: http://scp-wiki-cn.wikidot.com
  scopeType: "prefix"
  exclude:
  - \?q=
  - /signin
  - \?cid=
  - /forum
  - timestamp=

blockRules:
- url: (\w+\.)*ad-delivery.net
- url: (\w+\.)*doubleclick.net
- url: (\w+\.)*btloader.com
