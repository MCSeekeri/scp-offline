- url: (\w+\.)*nitropay.com
- url: (\w+\.)*doubleclick,net
- url: (\w+\.)*nitropay.com
- url: (\w+\.)*onesignal.com
- url: (\w+\.)*zh\.xjo\.ch
- url: (\w+\.)*dun\.163\.com
- url: (\w+\.)*music\.163\.com
- url: (\w+\.)*bilibili\.com
- url: (\w+\.)*bilivideo\.com
- url: (\w+\.)*fbcdn\.net
- url: (\w+\.)*vimeocdn\.com
- url: (\w+\.)*soundcloud\.com
- url: (\w+\.)*scpdb\.org
- url: (\w+\.)*avn\.sh
